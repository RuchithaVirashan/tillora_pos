<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promotion manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 14px">
<a href="BackOffice.dc.html" aria-label="Back to Back Office" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">BACK OFFICE · PROMOTION</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">{{title}}</h1></div>
</div>
<div role="tablist" aria-label="Promotion" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.08)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.aria}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button></sc-for>
</div>
</header>

<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 10px">
<input type="search" aria-label="ID / Description / Barcode" placeholder="ID / Description / Barcode" style="flex-grow: 1; height: 50px; box-sizing: border-box; border-radius: 13px; border: 1px solid #DCE2EA; background: #FFFFFF; padding: 0 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D">
<button type="button" style="height: 50px; padding: 0 20px; border-radius: 13px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Search</button>
<button type="button" onClick="{{goAdd}}" style="height: 50px; padding: 0 20px; border-radius: 13px; border: 0; background: #0B8A5F; color: #FFFFFF; font-size: 15px; font-weight: 800">Add New</button>
<button type="button" onClick="{{goAdd}}" style="height: 50px; padding: 0 18px; border-radius: 13px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Edit</button>
<button type="button" onClick="{{askDelete}}" style="height: 50px; padding: 0 18px; border-radius: 13px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 15px; font-weight: 800">Delete</button>
</div>
<sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 14px; background: #FDECEA; border: 1px solid #F5C9C4; padding: 12px 16px">
<span style="font-size: 14px; font-weight: 700; color: #A12A21">Are you sure you want to delete promotion {{selName}}?</span>
<span style="display: flex; gap: 8px"><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 13px; font-weight: 800">No</button><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #C0362C; color: #FFFFFF; font-size: 13px; font-weight: 800">Delete</button></span>
</div>
</sc-if>
<div style="flex-grow: 1; min-height: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 80px 1fr 150px 130px 130px 140px; gap: 12px; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>ID</span><span>DESCRIPTION</span><span>PROMO TYPE</span><span style="text-align: right">PRICE</span><span>START DATE</span><span>END DATE</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}"><span style="font-size: 14px; color: #475467; text-align: left">{{r.id}}</span><span style="font-size: 15px; font-weight: 700; text-align: left">{{r.name}}</span><span style="font-size: 14px; color: #475467; text-align: left">{{r.type}}</span><span style="font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{r.price}}</span><span style="font-size: 14px; color: #475467; text-align: left">{{r.start}}</span><span style="font-size: 14px; color: #475467; text-align: left">{{r.end}}</span></button>
</sc-for>
</div>
</main>
</sc-if>

<sc-if value="{{isAdd}}" hint-placeholder-val="{{ false }}">
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; gap: 18px">
<section style="width: 460px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 700; color: #344054">Promo Type:</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="3"><button type="button" onClick="{{k.pick}}" style="{{k.style}}">{{k.name}}</button></sc-for></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Description<input type="text" value="{{kindDesc}}" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Start Date<input type="text" value="[18/10/2026]" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">End Date<input type="text" value="[31/10/2026]" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">QTY<input type="text" value="{{kindQty}}" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Amount<input type="text" value="{{kindAmt}}" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
</div>
<span style="font-size: 12px; color: #667085">{{kindNote}}</span>
<button type="button" style="margin-top: auto; height: 54px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Save</button>
</section>
<section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="1">
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 800">{{g.name}}</span><input type="search" aria-label="Add product by barcode" placeholder="Scan barcode to add" style="height: 40px; width: 240px; box-sizing: border-box; border-radius: 10px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0F1B2D"></div>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="2"><div style="display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #EEF1F5; font-size: 14px"><span style="font-weight: 700">{{i.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #667085">{{i.code}}</span></div></sc-for>
</div>
</sc-for>
</section>
</main>
</sc-if>

<sc-if value="{{isRestore}}" hint-placeholder-val="{{ false }}">
<main style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 620px; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 22px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 22px; font-weight: 800">Restore Promotions</h2>
<span style="font-size: 13px; font-weight: 700; color: #344054">XLSX File</span>
<div style="height: 180px; border-radius: 16px; border: 2px dashed #C3CCD8; background: #F7F9FB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #475467"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg><span style="font-size: 15px; font-weight: 800; color: #0F1B2D">Click here to select XLSX file</span></div>
<div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px"><button type="button" style="height: 54px; border-radius: 14px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Cancel</button><button type="button" style="height: 54px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Restore</button></div>
</div>
</main>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 0, sel: 0, confirm: false, kind: 0 }; }
renderVals() {
const s = this.state;
const f = (v) => 'Rs ' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const names = ['Promotion Manager', 'Add Promotion', 'Restore Promotions'];
const tabs = names.map((name, i) => ({ name, aria: i === s.tab ? 'true' : 'false', pick: () => this.setState({ tab: i, confirm: false }), style: 'height: 42px; padding: 0 14px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 800; ' + (i === s.tab ? 'background: #FFFFFF; color: #0D2547' : 'background: transparent; color: #C7D4E6') }));
const data = [['P01', 'Buy 2 water get 1 free', 'Buy X Get Y Free', 200, '[01/10/2026]', '[31/10/2026]'], ['P02', 'Breakfast bundle', 'Bundle Offer', 900, '[01/10/2026]', '[30/11/2026]'], ['P03', 'Lunch meal deal', 'Meal Deal', 650, '[15/10/2026]', '[15/12/2026]'], ['P04', 'Biscuits 3 for Rs 600', 'Bundle Offer', 600, '[01/10/2026]', '[15/11/2026]']];
const rows = data.map((d, i) => ({ id: d[0], name: d[1], type: d[2], price: f(d[3]), start: d[4], end: d[5], pick: () => this.setState({ sel: i, confirm: false }), style: 'display: grid; grid-template-columns: 80px 1fr 150px 130px 130px 140px; gap: 12px; align-items: center; min-height: 56px; padding: 0 20px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sel ? '#EDF3FC; box-shadow: inset 4px 0 0 #F5A524' : '#FFFFFF') }));
const kindList = [
['Buy X Get Y Free', 'Buy 2 water get 1 free', '3', 'Rs 200.00', 'Customer buys QTY items and pays Amount.', [['Group 1', [['Water 500ml', '4791111000048']]]]],
['Bundle Offer', 'Breakfast bundle', '3', 'Rs 900.00', 'All bundle items together sell for Amount.', [['Bundle items', [['Fresh Milk 1L', '4791111000017'], ['Sliced Bread 450g', '4791111000024'], ['Eggs x10', '4791111000031']]]]],
['Meal Deal', 'Lunch meal deal', '3', 'Rs 650.00', 'Please add products to groups 1, 2, and 3 for Meal Deal. Same product cannot be used in multiple groups.', [['Group 1 · Main', [['Sandwich', '4791111000141']]], ['Group 2 · Snack', [['Biscuits', '4791111000101']]], ['Group 3 · Drink', [['Water 500ml', '4791111000048']]]]]
];
const k = kindList[s.kind];
const kinds = kindList.map((x, i) => ({ name: x[0], pick: () => this.setState({ kind: i }), style: 'height: 52px; border-radius: 12px; font-size: 13px; font-weight: 800; line-height: 1.2; ' + (i === s.kind ? 'border: 2px solid #163A6B; background: #EDF3FC; color: #163A6B' : 'border: 1px solid #E3E8EF; background: #F7F9FB; color: #344054') }));
const groups = k[5].map(([name, items]) => ({ name, items: items.map(([n, code]) => ({ name: n, code })) }));
return {
tabs, rows, kinds, groups, title: names[s.tab], isList: s.tab === 0, isAdd: s.tab === 1, isRestore: s.tab === 2,
confirm: s.confirm, selName: data[s.sel][1],
kindDesc: k[1], kindQty: k[2], kindAmt: k[3], kindNote: k[4],
goAdd: () => this.setState({ tab: 1 }), askDelete: () => this.setState({ confirm: true }), cancelDelete: () => this.setState({ confirm: false })
};
}
}
</script>
</body>
</html>
