<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Staff Activity</h1>
</header>
<main style="flex-grow: 1; box-sizing: border-box; padding: 28px; display: flex; justify-content: center">
<div style="width: 960px; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 20px; overflow: hidden; align-self: flex-start">
<div style="display: grid; grid-template-columns: 1fr 260px 160px; gap: 12px; padding: 14px 24px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>USER</span><span>SHIFT STARTED</span><span>STATUS</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 1fr 260px 160px; gap: 12px; align-items: center; min-height: 66px; padding: 0 24px; border-bottom: 1px solid #EEF1F5">
<span style="display: flex; align-items: center; gap: 12px"><span style="{{r.avatar}}">{{r.ini}}</span><span style="font-size: 16px; font-weight: 800">{{r.name}}</span></span>
<span style="font-size: 15px; color: #475467; font-variant-numeric: tabular-nums">{{r.started}}</span>
<span style="{{r.pill}}"><span style="{{r.dot}}"></span>{{r.status}}</span>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const tints = [['#E8EEFB', '#2952A3'], ['#E3F5EE', '#0B7A55'], ['#FFF3DC', '#9A5B00'], ['#EFEAFB', '#5B3FB0'], ['#EEF1F5', '#3B4A60']];
const data = [['[Staff 1]', 'AB', '[11 Oct 2026 · 09:00]', 'Running'], ['[Staff 2]', 'CD', '[11 Oct 2026 · 08:30]', 'Running'], ['[Manager]', 'GH', '[11 Oct 2026 · 07:45]', 'Stopped'], ['[Staff 3]', 'EF', '[10 Oct 2026 · 14:00]', 'Stopped'], ['[Staff 4]', 'IJ', '[10 Oct 2026 · 09:00]', 'Stopped']];
const rows = data.map(([name, ini, started, status], i) => {
const on = status === 'Running';
return {
name, ini: '[' + ini + ']', started, status,
avatar: 'width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: ' + tints[i][0] + '; color: ' + tints[i][1],
pill: 'width: fit-content; height: 30px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; ' + (on ? 'background: #E3F5EE; color: #0B6B4A' : 'background: #EEF1F5; color: #475467'),
dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + (on ? '#0B8A5F' : '#98A2B3')
};
});
return { rows };
}
}
</script>
</body>
</html>
