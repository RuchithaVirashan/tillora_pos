<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Other payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1A2436; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="Other Payment" style="width: 1100px; height: 760px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6)">
<div style="height: 80px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; border-bottom: 1px solid #E3E8EF; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Other Payment</h1>
<a href="Sales.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF1F5; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex">
<div style="flex-grow: 1; box-sizing: border-box; padding: 26px 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="border-radius: 16px; background: #F6F8FB; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; color: #667085">Total</span><span style="font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums">Rs 2,080.00</span></div>
<div style="border-radius: 16px; background: #F6F8FB; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; color: #667085">Paid</span><span style="font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums">Rs 0.00</span></div>
<div style="border-radius: 16px; background: #163A6B; color: #FFFFFF; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; color: #C7D4E6">Balance</span><span style="font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums">Rs 2,080.00</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 700; color: #667085">Payment types from Payment Type Manager</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{t.pick}}" style="{{t.style}}">
<span style="width: 56px; height: 40px; border-radius: 8px; background: #EEF1F5; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #667085">[Image]</span>
<span style="font-size: 15px; font-weight: 800; color: #0F1B2D">{{t.name}}</span>
</button>
</sc-for>
</div>
</div>
<button type="button" onClick="{{flip}}" aria-pressed="{{partialAria}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; border-radius: 16px; border: 1px solid #E3E8EF; background: #FFFFFF; padding: 16px 20px; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800; color: #0F1B2D">Partial Payment</span><span style="font-size: 14px; color: #667085">Pay part of the balance with this type</span></span>
<span style="{{track}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
<div style="margin-top: auto; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #FFF4DE; padding: 14px 18px; color: #8A5300">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
<span style="font-size: 15px; font-weight: 700">{{confirmText}}</span>
</div>
</div>
<div style="width: 380px; flex-shrink: 0; box-sizing: border-box; padding: 26px; background: #F6F8FB; border-left: 1px solid #E3E8EF; display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700; color: #667085">Amount
<input type="text" value="{{amountText}}" readonly style="height: 72px; box-sizing: border-box; border-radius: 18px; border: 2px solid #163A6B; background: #FFFFFF; padding: 0 18px; text-align: right; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 800; color: #0F1B2D"></label>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button type="button" style="{{k.style}}">{{k.label}}</button></sc-for>
</div>
<a href="CustomerDisplay.dc.html" style="height: 64px; border-radius: 16px; background: #0B8A5F; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 24px -12px rgba(11,138,95,0.8)">{{payLabel}}</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0, partial: false }; }
renderVals() {
const s = this.state;
const names = ['[Gift Voucher]', '[Customer Account]', '[Cheque]', '[Mobile Wallet]', '[Bank Transfer]', '[Credit Note]'];
const types = names.map((name, i) => ({
name, pick: () => this.setState({ sel: i }),
style: 'height: 110px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #FFFFFF; ' + (i === s.sel ? 'border: 2px solid #163A6B; box-shadow: 0 8px 20px -12px rgba(22,58,107,0.6)' : 'border: 1px solid #E3E8EF')
}));
const keys = ['7','8','9','4','5','6','1','2','3','.','0','DEL'].map((l) => ({
label: l,
style: l === 'DEL' ? 'border-radius: 14px; border: 0; background: #E7EBF1; color: #273449; font-size: 15px; font-weight: 800' : 'border-radius: 14px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #0F1B2D; font-size: 24px; font-weight: 700'
}));
const n = names[s.sel];
const amt = s.partial ? 'Rs 1,000.00' : 'Rs 2,080.00';
return {
types, keys, amountText: amt,
partialAria: s.partial ? 'true' : 'false', flip: () => this.setState({ partial: !s.partial }),
track: 'width: 52px; height: 30px; flex-shrink: 0; border-radius: 999px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; ' + (s.partial ? 'background: #0B8A5F; justify-content: flex-end' : 'background: #C3CCD8; justify-content: flex-start'),
confirmText: s.partial ? 'Are you sure you want to complete the partial payment ' + amt + ' in ' + n + '?' : 'Are you sure you want to pay with ' + amt + ' in ' + n + '?',
payLabel: (s.partial ? 'Partial payment with ' : 'Pay with ') + n
};
}
}
</script>
</body>
</html>
