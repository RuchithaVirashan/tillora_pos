<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POS messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="Settings.dc.html" aria-label="Back to Settings" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">SETTINGS</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">POS Messages</h1></div>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; gap: 20px">
<nav aria-label="Exception type" style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #667085">Exception type</span>
<sc-for list="{{types}}" as="t" hint-placeholder-count="5"><button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}<span style="font-size: 12px; font-weight: 800; color: #667085">{{t.count}}</span></button></sc-for>
</nav>
<section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; font-size: 15px; font-weight: 700">{{typeName}} reasons <span style="color: #667085; font-weight: 600">· shown as choices at the till</span></span>
<button type="button" onClick="{{startAdd}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #0B8A5F; color: #FFFFFF; font-size: 14px; font-weight: 800">Add New</button>
<button type="button" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 14px; font-weight: 800">Edit</button>
<button type="button" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 14px; font-weight: 800">Delete</button>
</div>
<sc-if value="{{adding}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 10px; align-items: flex-end; border-radius: 16px; background: #FFFFFF; border: 2px solid #163A6B; padding: 14px 16px">
<label style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Add Record<input type="text" placeholder="Record" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<button type="button" onClick="{{stopAdd}}" style="height: 46px; padding: 0 22px; border-radius: 12px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 14px; font-weight: 800">Add</button>
</div>
</sc-if>
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden">
<sc-for list="{{records}}" as="r" hint-placeholder-count="4"><button type="button" onClick="{{r.pick}}" style="{{r.style}}"><span style="font-size: 13px; color: #667085; width: 40px; text-align: left">{{r.no}}</span><span style="font-size: 15px; font-weight: 700; text-align: left">{{r.text}}</span></button></sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { type: 0, sel: 0, adding: false }; }
renderVals() {
const s = this.state;
const data = [
['Void Line', ['[Scanned in error]', '[Customer changed mind]', '[Wrong price]', '[Damaged item]']],
['Void Sale', ['[Customer left]', '[Payment declined]', '[Training]']],
['No Sale', ['[Give change for a note]', '[Check drawer float]', '[Correct a mistake]', '[Other]']],
['Age Refusal', ['[No ID shown]', '[Under 21]', '[Proxy purchase]']],
['Refund', ['[Faulty item]', '[Out of date]', '[Wrong item sold]']]
];
const types = data.map(([name, list], i) => ({ name, count: String(list.length), pick: () => this.setState({ type: i, sel: 0, adding: false }), style: 'height: 52px; border-radius: 13px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; ' + (i === s.type ? 'border: 2px solid #163A6B; background: #EDF3FC; color: #163A6B' : 'border: 1px solid #E3E8EF; background: #FFFFFF; color: #344054') }));
const records = data[s.type][1].map((text, i) => ({ text, no: String(i + 1), pick: () => this.setState({ sel: i }), style: 'width: 100%; min-height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sel ? '#EDF3FC; box-shadow: inset 4px 0 0 #F5A524' : '#FFFFFF') }));
return { types, records, typeName: data[s.type][0], adding: s.adding, startAdd: () => this.setState({ adding: true }), stopAdd: () => this.setState({ adding: false }) };
}
}
</script>
</body>
</html>
