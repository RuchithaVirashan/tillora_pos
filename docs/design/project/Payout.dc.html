<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1A2436; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="Payout" style="width: 900px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; padding: 30px; display: flex; gap: 26px; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6)">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 15px; background: #FFF3DC; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A5B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"></path><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 24px; font-weight: 800">Payout</h1><span style="font-size: 13px; color: #667085">Cash paid out of the drawer</span></div>
</div>
<span style="font-size: 14px; font-weight: 700; color: #344054">Reason for payout:</span>
<div role="radiogroup" aria-label="Reason for payout" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{r.aria}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.name}}</button></sc-for>
</div>
<span style="font-size: 12px; color: #667085">Payout items are set in Product Management › Manage Payout Products</span>
<div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px">
<a href="Sales.dc.html" style="height: 58px; border-radius: 16px; border: 1px solid #DCE2EA; color: #344054; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Cancel</a>
<a href="Sales.dc.html" style="height: 58px; border-radius: 16px; background: #163A6B; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Add</a>
</div>
</div>
<div style="width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: flex-end"><a href="Sales.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF1F5; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700; color: #667085">Amount
<input type="text" value="{{amountText}}" readonly style="height: 68px; box-sizing: border-box; border-radius: 16px; border: 2px solid #163A6B; background: #FFFFFF; padding: 0 18px; text-align: right; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; color: #0F1B2D"></label>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button type="button" onClick="{{k.press}}" style="{{k.style}}">{{k.label}}</button></sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0, amt: '500' }; }
renderVals() {
const s = this.state;
const reasons = ['[Staff tea]', '[Delivery charge]', '[Cleaning supplies]', '[Transport]', '[Shop repairs]', '[Other]'].map((name, i) => ({
name, aria: i === s.sel ? 'true' : 'false', pick: () => this.setState({ sel: i }),
style: 'height: 54px; border-radius: 14px; font-size: 15px; font-weight: 800; ' + (i === s.sel ? 'border: 2px solid #163A6B; background: #EDF3FC; color: #163A6B' : 'border: 1px solid #E3E8EF; background: #F7F9FB; color: #344054')
}));
const keys = ['7','8','9','4','5','6','1','2','3','00','0','DEL'].map((l) => ({
label: l,
press: () => this.setState({ amt: l === 'DEL' ? s.amt.slice(0, -1) : (s.amt + l).slice(0, 7) }),
style: 'height: 60px; border-radius: 14px; font-weight: 700; ' + (l === 'DEL' ? 'border: 0; background: #E7EBF1; color: #273449; font-size: 15px; font-weight: 800' : 'border: 1px solid #DCE2EA; background: #FFFFFF; color: #0F1B2D; font-size: 22px')
}));
const v = parseInt(s.amt || '0', 10);
return { reasons, keys, amountText: 'Rs ' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',') };
}
}
</script>
</body>
</html>
