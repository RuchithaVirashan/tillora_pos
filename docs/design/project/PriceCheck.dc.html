<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Price check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1A2436; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="Price Check" style="position: relative; width: 820px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6)">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Price Check</h1>
<a href="Sales.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF1F5; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; gap: 10px">
<input type="search" aria-label="Barcode / PLU code / Description" value="4791111000031" placeholder="Barcode / PLU code / Description" style="flex-grow: 1; height: 56px; box-sizing: border-box; border-radius: 14px; border: 2px solid #163A6B; background: #FFFFFF; padding: 0 16px; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: #0F1B2D">
<button type="button" style="height: 56px; padding: 0 24px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 16px; font-weight: 800">Check</button>
</div>
<div style="border-radius: 18px; border: 1px solid #E3E8EF; padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 20px; font-weight: 800">Eggs x10</span><span style="font-size: 13px; color: #667085">Dairy · Stock 6 · Expiry [25 Oct 2026]</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end"><span style="font-size: 12px; font-weight: 700; color: #667085">Current Price</span><span style="font-size: 30px; font-weight: 800; color: #163A6B; font-variant-numeric: tabular-nums">Rs 550.00</span></div>
</div>
<div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">New Price
<input type="text" value="Rs 580.00" readonly style="height: 56px; box-sizing: border-box; border-radius: 14px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; color: #0F1B2D"></label>
<button type="button" onClick="{{update}}" style="height: 56px; padding: 0 22px; border-radius: 14px; border: 0; background: #0B8A5F; color: #FFFFFF; font-size: 16px; font-weight: 800">Update Price</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Confirm Expiration</button>
<button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 15px; font-weight: 800">Mark as Expired</button>
</div>

<sc-if value="{{prompt}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; border-radius: 28px; background: rgba(15,27,45,0.55); display: flex; align-items: center; justify-content: center">
<div style="width: 460px; box-sizing: border-box; border-radius: 22px; background: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #E3F5EE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B7A55" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="font-size: 20px; font-weight: 800">Success</span>
<span style="font-size: 15px; color: #475467">Price updated successfully. Do you want to print the label?</span>
<span style="font-size: 13px; font-weight: 700; color: #344054">Select Label Type</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 48px; border-radius: 12px; border: 2px solid #163A6B; background: #EDF3FC; color: #163A6B; font-size: 15px; font-weight: 800">QL</button>
<button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #E3E8EF; background: #F7F9FB; color: #344054; font-size: 15px; font-weight: 800">Receipt</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{close}}" style="height: 50px; border-radius: 13px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 50px; border-radius: 13px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Print</button>
</div>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { prompt: false }; }
renderVals() {
return { prompt: this.state.prompt, update: () => this.setState({ prompt: true }), close: () => this.setState({ prompt: false }) };
}
}
</script>
</body>
</html>
