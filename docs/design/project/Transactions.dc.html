<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transactions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1A2436; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="Transactions" style="width: 1200px; height: 780px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6)">
<div style="height: 80px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; border-bottom: 1px solid #E3E8EF; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 24px; font-weight: 800">Transactions</h1><span style="font-size: 13px; color: #667085">This shift · [Staff name] · Terminal [POS-01]</span></div>
<a href="Sales.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF1F5; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #E3E8EF">
<div style="display: grid; grid-template-columns: 110px 80px 1fr 130px 110px; gap: 12px; padding: 12px 24px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>RECEIPT</span><span>TIME</span><span>PAY TYPE</span><span style="text-align: right">TOTAL</span><span>TYPE</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: left">{{r.no}}</span>
<span style="font-size: 14px; color: #475467; text-align: left">{{r.time}}</span>
<span style="font-size: 14px; font-weight: 700; text-align: left">{{r.method}}</span>
<span style="font-size: 15px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums">{{r.total}}</span>
<span style="{{r.pill}}">{{r.kind}}</span>
</button>
</sc-for>
</div>
<div style="width: 400px; flex-shrink: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Transaction Details</h2>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #475467"><span style="font-family: 'JetBrains Mono', monospace; color: #0F1B2D; font-weight: 600">{{selNo}}</span><span>[11 Oct] {{selTime}}</span></div>
<div style="border-radius: 14px; background: #F6F8FB; padding: 4px 16px; display: flex; flex-direction: column">
<sc-for list="{{items}}" as="i" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #E3E8EF; font-size: 14px; font-variant-numeric: tabular-nums"><span>{{i.name}}</span><span style="font-weight: 700">{{i.amount}}</span></div>
</sc-for>
<div style="display: flex; justify-content: space-between; padding: 12px 0 8px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums"><span>Total</span><span>{{selTotal}}</span></div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px"><span style="color: #475467">Pay type</span><span style="font-weight: 800">{{selMethod}}</span></div>
<sc-if value="{{swapping}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; border-radius: 14px; border: 1px solid #E3E8EF; padding: 12px">
<span style="font-size: 13px; font-weight: 700; color: #344054">Swap type</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{swapTo}}" as="w" hint-placeholder-count="4"><button type="button" onClick="{{w.pick}}" style="height: 44px; border-radius: 11px; border: 1px solid #DCE2EA; background: #F7F9FB; font-size: 14px; font-weight: 800; color: #163A6B">{{w.name}}</button></sc-for>
</div>
</div>
</sc-if>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{swap}}" style="height: 52px; border-radius: 14px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Swap Pay type</button>
<button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Print Receipt</button>
<a href="Sales.dc.html" style="height: 52px; border-radius: 14px; background: #EEF1F5; color: #344054; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">Close</a>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0, swapping: false, methods: ['Cash', 'Card', 'Cash', 'Cash', '[Gift Voucher]', 'Cash', 'Card', 'Cash'] }; }
renderVals() {
const s = this.state;
const f = (v) => 'Rs ' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const meta = [['#000123', '10:42', 'Sale'], ['#000122', '10:31', 'Sale'], ['#000121', '10:12', 'Sale'], ['#000120', '09:58', 'Refund'], ['#000119', '09:47', 'Sale'], ['#000118', '09:30', 'Sale'], ['#000117', '09:22', 'Sale'], ['#000116', '09:05', 'Sale']];
const items = [[['Fresh Milk 1L', 480], ['Sliced Bread 450g', 180], ['Eggs x10 × 2', 1100], ['Ambul Bananas 1kg', 320]], [['Coffee', 250], ['Fish Bun × 2', 160]], [['Samba Rice 5kg', 1450], ['Dhal 1kg', 390]], [['Water 500ml × 2', 200]], [['Lottery Ticket × 5', 200]], [['Biscuits', 220], ['Plain Tea', 100]], [['Eggs x10', 550]], [['Newspaper', 120]]];
const totalOf = (i) => items[i].reduce((a, x) => a + x[1], 0);
const rows = meta.map(([no, time, kind], i) => ({
no, time, kind, method: s.methods[i], total: (kind === 'Refund' ? '−' : '') + f(totalOf(i)),
pick: () => this.setState({ sel: i, swapping: false }),
pill: 'width: fit-content; height: 26px; padding: 0 10px; border-radius: 999px; display: flex; align-items: center; font-size: 12px; font-weight: 800; ' + (kind === 'Refund' ? 'background: #FDECEA; color: #A12A21' : 'background: #E3F5EE; color: #0B6B4A'),
style: 'display: grid; grid-template-columns: 110px 80px 1fr 130px 110px; gap: 12px; align-items: center; min-height: 56px; padding: 0 24px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sel ? '#EDF3FC; box-shadow: inset 4px 0 0 #F5A524' : '#FFFFFF')
}));
const swapTo = ['Cash', 'Card', '[Gift Voucher]', '[Customer Account]'].filter((m) => m !== s.methods[s.sel]).map((name) => ({
name, pick: () => { const m = s.methods.slice(); m[s.sel] = name; this.setState({ methods: m, swapping: false }); }
}));
return {
rows, swapTo, swapping: s.swapping, swap: () => this.setState({ swapping: !s.swapping }),
items: items[s.sel].map(([name, v]) => ({ name, amount: f(v) })),
selNo: meta[s.sel][0], selTime: meta[s.sel][1], selMethod: s.methods[s.sel], selTotal: f(totalOf(s.sel))
};
}
}
</script>
</body>
</html>
