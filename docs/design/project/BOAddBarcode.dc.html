<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add barcode product</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 14px">
<a href="BOBarcodes.dc.html" aria-label="Back to Manage Barcode Products" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">MANAGE BARCODE PRODUCTS</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">Add Barcode Product</h1></div>
</div>
<button type="button" style="height: 46px; padding: 0 26px; border-radius: 12px; border: 0; background: #F5A524; color: #0D2547; font-size: 15px; font-weight: 800">Save</button>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; gap: 18px">
<section style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Barcode<input type="text" value="4791111000031" inputmode="numeric" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #0F1B2D"><span style="font-size: 12px; font-weight: 500; color: #667085">Numbers only, no spaces</span></label>
<label style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Description<input type="text" value="Eggs x10" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<button type="button" role="switch" aria-checked="{{secAria}}" onClick="{{flipSec}}" style="grid-column: span 3; height: 46px; border-radius: 12px; border: 1px solid #E3E8EF; background: #F7F9FB; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; color: #344054">Enable Secondary Barcode<span style="{{secTrack}}"><span style="width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span></button>
<sc-if value="{{showSec}}" hint-placeholder-val="{{ false }}">
<label style="grid-column: span 3; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Secondary Barcode<input type="text" value="47911A1 0003" aria-invalid="true" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 2px solid #C0362C; background: #FFFFFF; padding: 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #0F1B2D"><span style="font-size: 12px; font-weight: 600; color: #A12A21">Numbers only — remove letters and spaces</span></label>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Price<input type="text" value="Rs 550.00" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 2px solid #163A6B; background: #FFFFFF; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 800; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Department<select style="height: 46px; border-radius: 12px; border: 1px solid #DCE2EA; padding: 0 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D; background: #F7F9FB"><option>Dairy</option><option>Select Department</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Sub Department<select style="height: 46px; border-radius: 12px; border: 1px solid #DCE2EA; padding: 0 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D; background: #F7F9FB"><option>Eggs</option><option>Select Sub Department</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">VAT<select style="height: 46px; border-radius: 12px; border: 1px solid #DCE2EA; padding: 0 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D; background: #F7F9FB"><option>VAT exempt</option><option>VAT 18%</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Initial Stock<input type="text" value="30" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; align-items: center; gap: 10px; height: 46px; align-self: end; font-size: 14px; font-weight: 700; color: #344054"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #163A6B">Age Refusal</label>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Case Barcode<input type="text" value="4791111900031" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Units Per Case<input type="text" value="30" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Cost per Case<input type="text" value="Rs 13,500.00" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<div style="border-radius: 14px; background: #F6F8FB; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; color: #667085">Cost Price</span><span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">Rs 450.00</span></div>
<div style="border-radius: 14px; background: #E3F5EE; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; color: #0B6B4A">Margin</span><span style="font-size: 20px; font-weight: 800; color: #0B6B4A; font-variant-numeric: tabular-nums">18.18%</span></div>
<span style="font-size: 12px; color: #667085; align-self: center">Please change your case barcode if it matches the item barcode. Duplicate barcodes cannot be saved.</span>
</div>
</section>
<aside style="width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 700; color: #344054">Upload Image:</span>
<div style="height: 180px; border-radius: 14px; border: 1px dashed #C3CCD8; background: #F7F9FB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #667085"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg><span style="font-size: 13px; font-weight: 700">[Product image]</span></div>
</div>
<button type="button" role="switch" aria-checked="{{quickAria}}" onClick="{{flipQuick}}" style="height: 56px; border-radius: 14px; border: 1px solid #E3E8EF; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 800; color: #0F1B2D">Add Quick Item<span style="{{quickTrack}}"><span style="width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span></button>
<span style="font-size: 13px; color: #667085">Quick items show as buttons on the sales screen.</span>
<button type="button" style="margin-top: auto; height: 56px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 16px; font-weight: 800">Save</button>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sec: true, quick: false }; }
renderVals() {
const s = this.state;
const track = (on) => 'width: 44px; height: 26px; border-radius: 999px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; ' + (on ? 'background: #0B8A5F; justify-content: flex-end' : 'background: #C3CCD8; justify-content: flex-start');
return {
showSec: s.sec, secAria: s.sec ? 'true' : 'false', secTrack: track(s.sec), flipSec: () => this.setState({ sec: !s.sec }),
quickAria: s.quick ? 'true' : 'false', quickTrack: track(s.quick), flipQuick: () => this.setState({ quick: !s.quick })
};
}
}
</script>
</body>
</html>
