<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No sale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1A2436; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="No Sale" style="width: 620px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6)">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 15px; background: #E8EEFB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2952A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="12" width="20" height="8" rx="2"></rect><path d="M6 12V5h12v7"></path><path d="M10 16h4"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 24px; font-weight: 800">No Sale</h1><span style="font-size: 13px; color: #667085">No sale count left today: [3]</span></div>
</div>
<a href="Sales.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF1F5; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700; color: #344054">Reason for no sale:</span>
<div role="radiogroup" aria-label="Reason for no sale" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{r.aria}}" onClick="{{r.pick}}" style="{{r.style}}"><span style="{{r.dot}}"></span>{{r.name}}</button>
</sc-for>
</div>
<span style="font-size: 12px; color: #667085">Reasons are set in Settings › POS Record Messages</span>
</div>
<div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px">
<a href="Sales.dc.html" style="height: 58px; border-radius: 16px; border: 1px solid #DCE2EA; color: #344054; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Cancel</a>
<a href="Sales.dc.html" style="{{openStyle}}">Open Cash Drawer</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: -1 }; }
renderVals() {
const s = this.state;
const reasons = ['[Give change for a note]', '[Check drawer float]', '[Correct a mistake]', '[Other]'].map((name, i) => ({
name, aria: i === s.sel ? 'true' : 'false', pick: () => this.setState({ sel: i }),
dot: 'width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; ' + (i === s.sel ? 'border: 6px solid #163A6B' : 'border: 2px solid #C3CCD8'),
style: 'height: 54px; border-radius: 14px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 700; color: #0F1B2D; text-align: left; ' + (i === s.sel ? 'border: 2px solid #163A6B; background: #EDF3FC' : 'border: 1px solid #E3E8EF; background: #FFFFFF')
}));
return {
reasons,
openStyle: 'height: 58px; border-radius: 16px; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; ' + (s.sel >= 0 ? 'background: #163A6B; color: #FFFFFF' : 'background: #E3E8EF; color: #667085; pointer-events: none')
};
}
}
</script>
</body>
</html>
