<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage departments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="BackOffice.dc.html" aria-label="Back to Back Office" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">BACK OFFICE · MANAGEMENT</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">Manage Departments</h1></div>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px 28px; display: flex; gap: 20px">
<section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; font-size: 14px; font-weight: 600; color: #667085">{{hint}}</span>
<button type="button" onClick="{{addNew}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 14px; font-weight: 800">Add New</button>
<button type="button" onClick="{{edit}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 14px; font-weight: 800">Edit</button>
<button type="button" onClick="{{askDelete}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 14px; font-weight: 800">Delete</button>
</div>
<sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 14px; background: #FDECEA; border: 1px solid #F5C9C4; padding: 12px 16px">
<span style="font-size: 14px; font-weight: 700; color: #A12A21">{{confirmText}}</span>
<span style="display: flex; gap: 8px"><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 13px; font-weight: 800">No</button><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #C0362C; color: #FFFFFF; font-size: 13px; font-weight: 800">Delete</button></span>
</div>
</sc-if>
<div style="flex-grow: 1; min-height: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<div style="{{headRow}}"><sc-for list="{{cols}}" as="c" hint-placeholder-count="5"><span style="{{c.style}}">{{c.name}}</span></sc-for></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}"><sc-for list="{{r.cells}}" as="x" hint-placeholder-count="5"><span style="{{x.style}}">{{x.text}}</span></sc-for></button>
</sc-for>
</div>
</section>
<aside style="width: 420px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 20px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">{{formTitle}}</h2>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
<sc-if value="{{f.isText}}" hint-placeholder-val="{{ true }}"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">{{f.label}}<input type="text" value="{{f.value}}" placeholder="{{f.hint}}" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label></sc-if>
<sc-if value="{{f.isCheck}}" hint-placeholder-val="{{ false }}"><label style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; color: #344054">{{f.label}}<input type="checkbox" checked="{{f.checked}}" style="width: 22px; height: 22px; accent-color: #163A6B"></label></sc-if>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #EEF1F5; padding-top: 12px">
<span style="font-size: 13px; font-weight: 700; color: #344054">Sub Departments</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{subs}}" as="sd" hint-placeholder-count="3"><span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #EEF1F5; color: #344054; font-size: 13px; font-weight: 700; display: flex; align-items: center">{{sd}}</span></sc-for></div>
<button type="button" style="height: 40px; border-radius: 11px; border: 1px dashed #C3CCD8; background: #F7F9FB; color: #163A6B; font-size: 13px; font-weight: 800">+ Add New Sub Department</button>
</div>
<button type="button" style="margin-top: auto; height: 54px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Save</button>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 1, mode: 'edit', confirm: false }; }
renderVals() {
const s = this.state;
const colDefs = [['ID', '70px', 'left'], ['DEPARTMENT', '1fr', 'left'], ['VAT', '110px', 'left'], ['AGE REFUSAL', '120px', 'center'], ['GROUP ID', '100px', 'left']];
const grid = colDefs.map((c) => c[1]).join(' ');
const data = [
['1', 'Grocery', 'VAT 18%', 'No', '[G1]', ['Rice', 'Dhal', 'Spices']],
['2', 'Dairy', 'VAT 18%', 'No', '[G1]', ['Milk', 'Curd', 'Yoghurt']],
['3', 'Bakery', 'VAT exempt', 'No', '[G2]', ['Bread', 'Buns']],
['4', 'Produce', 'VAT exempt', 'No', '[G2]', ['Fruit', 'Vegetables']],
['5', 'Drinks', 'VAT 18%', 'No', '[G3]', ['Water', 'Soft drinks']],
['6', 'Tobacco', 'VAT 18%', 'Yes', '[G4]', ['Cigarettes']],
['7', 'Lottery', 'VAT exempt', 'No', '[G5]', ['Draw tickets']]
];
const cell = (align) => 'font-size: 15px; text-align: ' + align + '; ';
const cols = colDefs.map(([name, w, align]) => ({ name, style: 'text-align: ' + align }));
const rows = data.map((d, i) => ({
pick: () => this.setState({ sel: i, mode: 'edit', confirm: false }),
cells: colDefs.map((c, j) => ({ text: d[j], style: cell(c[2]) + (j === 1 ? 'font-weight: 800' : 'color: #475467') })),
style: 'display: grid; grid-template-columns: ' + grid + '; gap: 12px; align-items: center; min-height: 54px; padding: 0 20px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sel && s.mode === 'edit' ? '#EDF3FC; box-shadow: inset 4px 0 0 #F5A524' : '#FFFFFF')
}));
const editing = s.mode === 'edit';
const d = data[s.sel];
const T = (label, hint, v) => ({ label, hint, value: editing ? v : '', isText: true, isCheck: false, checked: false });
const C = (label, on) => ({ label, hint: '', value: '', isText: false, isCheck: true, checked: editing && on });
const fields = [T('ID', 'Department ID', d[0]), T('Department', 'Department Name', d[1]), T('VAT', 'VAT', d[2]), T('Group ID', 'Select Group ID', d[4]), C('Age Refusal', d[3] === 'Yes'), C('Add Quick Menu', true)];
return {
cols, rows, fields, confirm: s.confirm,
headRow: 'display: grid; grid-template-columns: ' + grid + '; gap: 12px; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085',
hint: editing ? 'Selected: ' + d[1] : 'Please select a department to edit or delete',
formTitle: editing ? 'Edit Department' : 'Add New Department',
subs: editing ? d[5] : [],
confirmText: 'Are you sure you want to delete ' + d[1] + '?',
addNew: () => this.setState({ mode: 'add', confirm: false }),
edit: () => this.setState({ mode: 'edit' }),
askDelete: () => this.setState({ confirm: true }), cancelDelete: () => this.setState({ confirm: false })
};
}
}
</script>
</body>
</html>
