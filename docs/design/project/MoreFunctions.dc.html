<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>More functions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1A2436; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="More Functions" style="width: 880px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6)">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">More Functions</h1>
<a href="Sales.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF1F5; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{fns}}" as="t" hint-placeholder-count="6">
<sc-if value="{{t.isLink}}" hint-placeholder-val="{{ false }}">
<a href="{{t.href}}" style="{{t.card}}"><span style="{{t.chip}}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span><span style="font-size: 17px; font-weight: 800; color: #0F1B2D">{{t.name}}</span><span style="font-size: 13px; color: #667085">{{t.desc}}</span></a>
</sc-if>
<sc-if value="{{t.isBtn}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{t.press}}" aria-pressed="{{t.aria}}" style="{{t.card}}"><span style="{{t.chip}}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span><span style="font-size: 17px; font-weight: 800; color: #0F1B2D">{{t.name}}</span><span style="{{t.descStyle}}">{{t.desc}}</span></button>
</sc-if>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { autoPrint: true, training: false, reset: false }; }
renderVals() {
const s = this.state;
const list = [
['Cash Lift', 'Move cash to the safe', '#0B7A55', '#E3F5EE', 'M2 6h20v12H2zM12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5M6 12h.01M18 12h.01', 'CashLift.dc.html'],
['Open Calculator', 'Opens the system calculator', '#3B4A60', '#EEF1F5', 'M5 2h14v20H5zM8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h8', null],
['Auto Print', s.autoPrint ? 'On · print after every sale' : 'Off', '#2952A3', '#E8EEFB', 'M6 9V2h12v7M2 9h20v9H2zM6 14h12v8H6z', null, 'autoPrint'],
['Currency Converter', 'Convert to LKR', '#9A5B00', '#FFF3DC', 'M3 7h13l-3-3M21 17H8l3 3M7 11v2M17 11v2', null],
['Reset Void Counts', s.reset ? 'Counts reset for this shift' : 'Manager login needed', '#B4233C', '#FDECEE', 'M3 12a9 9 0 1 0 3-6.7M3 4v5h5', null, 'reset'],
['Training Mode', s.training ? 'On · sales are not recorded' : 'Off', '#5B3FB0', '#EFEAFB', 'M22 10L12 5 2 10l10 5zM6 12v5c3 2 9 2 12 0v-5', null, 'training']
];
const fns = list.map(([name, desc, ink, bg, icon, href, key]) => {
const on = key ? !!s[key] : false;
return {
name, desc, ink, icon, href: href || '#', isLink: !!href, isBtn: !href, aria: on ? 'true' : 'false',
press: () => { if (key) { const o = {}; o[key] = !s[key]; this.setState(o); } },
chip: 'width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: ' + bg,
descStyle: 'font-size: 13px; font-weight: ' + (on ? '800' : '500') + '; color: ' + (on ? ink : '#667085'),
card: 'height: 180px; box-sizing: border-box; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px; text-align: left; text-decoration: none; background: #FFFFFF; ' + (on ? 'border: 2px solid ' + ink : 'border: 1px solid #E3E8EF')
};
});
return { fns };
}
}
</script>
</body>
</html>
