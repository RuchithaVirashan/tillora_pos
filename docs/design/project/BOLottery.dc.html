<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage lottery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="BackOffice.dc.html" aria-label="Back to Back Office" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">BACK OFFICE · INVENTORY CONTROL</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">Manage Lottery</h1></div>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px 28px; display: flex; gap: 20px">
<section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; font-size: 14px; font-weight: 600; color: #667085">{{hint}}</span>
<button type="button" onClick="{{addNew}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 14px; font-weight: 800">Add New</button>
<button type="button" onClick="{{edit}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 14px; font-weight: 800">Edit</button>
<button type="button" onClick="{{askDelete}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 14px; font-weight: 800">Delete</button>
</div>
<sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 14px; background: #FDECEA; border: 1px solid #F5C9C4; padding: 12px 16px">
<span style="font-size: 14px; font-weight: 700; color: #A12A21">{{confirmText}}</span>
<span style="display: flex; gap: 8px"><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 13px; font-weight: 800">No</button><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #C0362C; color: #FFFFFF; font-size: 13px; font-weight: 800">Delete</button></span>
</div>
</sc-if>
<div style="flex-grow: 1; min-height: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 170px 1fr 120px 140px; gap: 12px; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>BARCODE</span><span>DESCRIPTION</span><span style="text-align: right">PRICE</span><span>DEPARTMENT</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475467; text-align: left">{{r.code}}</span><span style="font-size: 15px; font-weight: 800; text-align: left">{{r.name}}</span><span style="font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{r.price}}</span><span style="font-size: 14px; color: #475467; text-align: left">Lottery</span></button>
</sc-for>
</div>
</section>
<aside style="width: 420px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 20px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">{{formTitle}}</h2>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">{{f.label}}<input type="text" value="{{f.value}}" placeholder="{{f.hint}}" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label></sc-for>
<label style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; color: #344054">Age Refusal<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #163A6B"></label>
<button type="button" style="margin-top: auto; height: 54px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Save</button>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0, mode: 'edit', confirm: false }; }
renderVals() {
const s = this.state;
const f = (v) => 'Rs ' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const data = [['4790000000101', '[Daily draw ticket]', 40], ['4790000000102', '[Weekly draw ticket]', 40], ['4790000000103', '[Scratch card]', 100], ['4790000000104', '[Special draw ticket]', 200], ['4790000000105', '[Prize payout]', 0]];
const editing = s.mode === 'edit';
const rows = data.map(([code, name, price], i) => ({
code, name, price: f(price), pick: () => this.setState({ sel: i, mode: 'edit', confirm: false }),
style: 'display: grid; grid-template-columns: 170px 1fr 120px 140px; gap: 12px; align-items: center; min-height: 56px; padding: 0 20px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sel && editing ? '#EDF3FC; box-shadow: inset 4px 0 0 #F5A524' : '#FFFFFF')
}));
const d = data[s.sel];
const F = (label, hint, v) => ({ label, hint, value: editing ? v : '' });
const fields = [F('Barcode', 'Barcode', d[0]), F('Description', 'Description', d[1]), F('Price', 'Rs 0.00', f(d[2])), F('Department', 'Select Department', 'Lottery'), F('Sub Department', 'Select Sub Department', 'Draw tickets'), F('VAT', 'VAT', 'VAT exempt')];
return {
rows, fields, confirm: s.confirm,
hint: editing ? 'Selected: ' + d[1] : 'Please select an item to edit or delete',
formTitle: editing ? 'Edit Lottery' : 'Add New Lottery',
confirmText: 'Are you sure you want to delete ' + d[1] + '?',
addNew: () => this.setState({ mode: 'add', confirm: false }), edit: () => this.setState({ mode: 'edit' }),
askDelete: () => this.setState({ confirm: true }), cancelDelete: () => this.setState({ confirm: false })
};
}
}
</script>
</body>
</html>
