<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inventory settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="Settings.dc.html" aria-label="Back to Settings" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">SETTINGS</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">Inventory</h1></div>
</header>
<main style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 620px; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 22px; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<span style="width: 56px; height: 56px; border-radius: 16px; background: #FDECEA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C0362C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></span>
<h2 style="margin: 0; font-size: 22px; font-weight: 800">Stock reset</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #475467">Sets the stock of every product on this terminal back to zero. Use this before a full stock count. Products and prices are not changed.</p>
<div style="border-radius: 14px; background: #FFF4DE; color: #8A5300; padding: 12px 16px; font-size: 14px; font-weight: 700">Take a backup first in Backup &amp; Restore.</div>
<div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px">
<a href="SetBackup.dc.html" style="height: 54px; border-radius: 14px; border: 1px solid #DCE2EA; color: #344054; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">Backup first</a>
<button type="button" style="height: 54px; border-radius: 14px; border: 0; background: #C0362C; color: #FFFFFF; font-size: 15px; font-weight: 800">Stock reset</button>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
