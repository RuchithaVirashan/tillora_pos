<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shift end report</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1A2436; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="Shift End Report" style="width: 1160px; height: 800px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6)">
<div style="height: 84px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; border-bottom: 1px solid #E3E8EF; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 24px; font-weight: 800">Shift End Report</h1><span style="font-size: 13px; color: #667085">Step 2 of 2 · [Staff name] · [09:00] – [18:00] · Terminal [POS-01]</span></div>
<span style="height: 30px; padding: 0 12px; border-radius: 999px; background: #E3F5EE; color: #0B6B4A; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #0B8A5F"></span>Processing Completed</span>
</div>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 22px 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-content: start">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="5">
<div style="{{sec.box}}">
<h2 style="margin: 0 0 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #667085">{{sec.title}}</h2>
<sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #EEF1F5; font-size: 14px"><span>{{r.label}}</span><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{r.value}}</span></div>
</sc-for>
</div>
</sc-for>
</div>
<div style="height: 88px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; border-top: 1px solid #E3E8EF; display: flex; align-items: center; justify-content: flex-end; gap: 10px">
<span style="margin-right: auto; font-size: 13px; color: #667085">Sections shown are set in System Configuration › Shift Report Setting</span>
<button type="button" style="height: 56px; padding: 0 26px; border-radius: 15px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 16px; font-weight: 800">Print</button>
<a href="Main.dc.html" style="height: 56px; padding: 0 34px; border-radius: 15px; background: #0B8A5F; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center">OK</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const z = '[Rs 0.00]';
const data = [
['CASH FLOW', [['Drawer float', 'Rs 5,000.00'], ['Cash sales', z], ['Card sales', z], ['Other payments', z], ['Refunds', z], ['Cash lifts', z], ['Expected in drawer', z]], 1],
['DEPARTMENT', [['Grocery', z], ['Dairy', z], ['Bakery', z], ['Produce', z], ['Drinks', z], ['Lottery', z]], 1],
['VAT', [['VAT 18% — net', z], ['VAT 18% — tax', z], ['VAT exempt', z]], 1],
['HOURLY SALE', [['09:00 – 10:00', z], ['10:00 – 11:00', z], ['11:00 – 12:00', z], ['…', '']], 2],
['PAYOUT', [['[Staff tea]', z], ['[Delivery charge]', z], ['Total payouts', z]], 1]
];
const sections = data.map(([title, rows, span]) => ({
title, rows: rows.map(([label, value]) => ({ label, value })),
box: 'grid-column: span ' + span + '; border-radius: 18px; border: 1px solid #E3E8EF; padding: 16px 18px; display: flex; flex-direction: column'
}));
return { sections };
}
}
</script>
</body>
</html>
