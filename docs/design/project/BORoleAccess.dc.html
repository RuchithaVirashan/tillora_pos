<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Role access control</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 14px">
<a href="BackOffice.dc.html" aria-label="Back to Back Office" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">BACK OFFICE · MANAGEMENT</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">Role Access Control</h1></div>
</div>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #F5A524; color: #0D2547; font-size: 14px; font-weight: 800">Add New Role</button>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; gap: 20px">
<aside style="width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #667085">Select User</span>
<sc-for list="{{users}}" as="u" hint-placeholder-count="5"><button type="button" onClick="{{u.pick}}" style="{{u.style}}"><span style="font-size: 15px; font-weight: 800">{{u.name}}</span><span style="font-size: 12px; color: #667085">{{u.role}}</span></button></sc-for>
<div style="margin-top: auto; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; font-weight: 800">Set Count</span>
<sc-for list="{{counts}}" as="c" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #667085">{{c.label}}</span>
<div style="display: flex; align-items: center; gap: 6px"><button type="button" aria-label="Decrease" onClick="{{c.minus}}" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #DCE2EA; background: #F7F9FB; font-size: 18px; font-weight: 700; color: #344054">−</button><span style="flex-grow: 1; height: 40px; border-radius: 10px; border: 1px solid #DCE2EA; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">{{c.value}}</span><button type="button" aria-label="Increase" onClick="{{c.plus}}" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #DCE2EA; background: #F7F9FB; font-size: 18px; font-weight: 700; color: #344054">+</button></div></div>
</sc-for>
</div>
</aside>
<section style="flex-grow: 1; min-width: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 20px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div role="tablist" aria-label="Access area" style="display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: #EEF1F5">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{t.aria}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button></sc-for>
</div>
<span style="font-size: 13px; font-weight: 700; color: #667085">{{summary}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start; flex-grow: 1; overflow-y: auto">
<sc-for list="{{items}}" as="i" hint-placeholder-count="10">
<button type="button" role="checkbox" aria-checked="{{i.aria}}" onClick="{{i.flip}}" style="{{i.style}}"><span style="{{i.box}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>{{i.name}}</button>
</sc-for>
</div>
<div style="display: flex; justify-content: flex-end"><button type="button" style="height: 52px; padding: 0 28px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Update</button></div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) {
super(p);
this.state = { user: 2, tab: 0, off: {}, counts: [5, 3, 10] };
}
renderVals() {
const s = this.state;
const lists = {
'Sales': ['Sales Login Access', 'No Sales Access', 'Void Sales Access', 'Void Line Access', 'Refund Access', 'Cash Lift Access', 'Product Discount Access', 'Sale Discount Access', 'Shift End Report Access', 'Price Update Access - Price Check', 'Swap Pay Type Access - Transaction History'],
'Back Office': ['Backoffice Login Access', 'Department Manager Access', 'User Manager Access', 'Payment Type Manager Access', 'Role Access Manager Access', 'Sales Manager Access', 'Stock Manager Access', 'Product Manager Access', 'Lottery Access', 'News Paper and Magazine Access', 'Label Printer Access', 'Stock Movement Report Access', 'Sale Report Access', 'Stock Adjustment Report Access', 'Promotion Manager Access', 'Restore Promotion Access'],
'Product Manager': ['Add Weight Products Access', 'Manage Payout Product Access', 'Adjust Stock Access', 'Price Check Access', 'Quick Label Access'],
'Reports': ['Report Login Access', 'Live Shift Report Access', 'All Shift Report Access', 'Exceptions Access', 'Expired Items Report Access']
};
const tabNames = Object.keys(lists);
const userList = [['[admin]', 'Admin'], ['[manager]', 'Manager'], ['[staff1]', 'Cashier'], ['[staff2]', 'Cashier'], ['[staff3]', 'Supervisor']];
const cashierDefault = (tab, name) => tab === 'Sales' && ['Sales Login Access', 'Cash Lift Access', 'Price Update Access - Price Check'].indexOf(name) >= 0 || tab === 'Sales' && name === 'No Sales Access';
const isOn = (tab, name) => {
const k = s.user + '|' + tab + '|' + name;
if (s.off[k] !== undefined) return s.off[k];
const role = userList[s.user][1];
if (role === 'Admin' || role === 'Manager') return true;
if (role === 'Supervisor') return tab !== 'Back Office' || name === 'Backoffice Login Access' || name === 'Stock Manager Access';
return cashierDefault(tab, name);
};
const tab = tabNames[s.tab];
const items = lists[tab].map((name) => {
const on = isOn(tab, name);
return {
name, aria: on ? 'true' : 'false',
flip: () => { const o = Object.assign({}, s.off); o[s.user + '|' + tab + '|' + name] = !on; this.setState({ off: o }); },
box: 'width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (on ? 'background: #0B8A5F' : 'background: #FFFFFF; border: 2px solid #C3CCD8'),
style: 'height: 52px; border-radius: 13px; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 14px; font-weight: 700; color: #0F1B2D; ' + (on ? 'border: 1px solid #C5E8D7; background: #F2FAF6' : 'border: 1px solid #E3E8EF; background: #FFFFFF')
};
});
const tabs = tabNames.map((name, i) => ({
name, aria: i === s.tab ? 'true' : 'false', pick: () => this.setState({ tab: i }),
style: 'height: 42px; padding: 0 16px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 800; ' + (i === s.tab ? 'background: #FFFFFF; color: #163A6B; box-shadow: 0 1px 3px rgba(16,24,40,0.15)' : 'background: transparent; color: #475467')
}));
const users = userList.map(([name, role], i) => ({
name, role, pick: () => this.setState({ user: i }),
style: 'height: 60px; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; color: #0F1B2D; background: #FFFFFF; ' + (i === s.user ? 'border: 2px solid #163A6B' : 'border: 1px solid #E3E8EF')
}));
const countLabels = ['No Sale Access Count', 'Void Sale Access Count', 'Void Line Access Count'];
const counts = countLabels.map((label, i) => ({
label, value: String(s.counts[i]),
minus: () => { const c = s.counts.slice(); c[i] = Math.max(0, c[i] - 1); this.setState({ counts: c }); },
plus: () => { const c = s.counts.slice(); c[i] = c[i] + 1; this.setState({ counts: c }); }
}));
return { items, tabs, users, counts, summary: items.filter((i) => i.aria === 'true').length + ' of ' + items.length + ' allowed for ' + userList[s.user][0] };
}
}
</script>
</body>
</html>
