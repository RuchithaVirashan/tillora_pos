<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exception report</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="QuickReport.dc.html" aria-label="Back to Quick Report" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Exception Report</h1>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 12px; align-items: flex-end; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 16px 18px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #667085">Start Date<input type="text" value="[01/10/2026]" readonly style="height: 46px; width: 150px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #667085">End Date<input type="text" value="[11/10/2026]" readonly style="height: 46px; width: 150px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #667085">Exceptions</span>
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #EEF1F5">
<sc-for list="{{types}}" as="t" hint-placeholder-count="5"><button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button></sc-for>
</div></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #667085">Shift<select style="height: 46px; width: 180px; border-radius: 12px; border: 1px solid #DCE2EA; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D; background: #F7F9FB"><option>Please select Shift</option></select></label>
<button type="button" style="margin-left: auto; height: 46px; padding: 0 20px; border-radius: 12px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Generate</button>
<button type="button" style="height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Print Report</button>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 16px">
<div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 110px 150px 1fr 1fr 130px; gap: 12px; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>RECEIPT</span><span>DATE</span><span>USER</span><span>REASON</span><span style="text-align: right">AMOUNT</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: left">{{r.no}}</span><span style="font-size: 14px; color: #475467; text-align: left">{{r.date}}</span><span style="font-size: 14px; font-weight: 700; text-align: left">{{r.user}}</span><span style="font-size: 14px; color: #475467; text-align: left">{{r.reason}}</span><span style="font-size: 15px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums">{{r.amount}}</span>
</button>
</sc-for>
</div>
<div style="width: 380px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Exception Items</h2>
<div style="display: grid; grid-template-columns: 1fr 40px 80px 90px; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #667085; padding-bottom: 8px; border-bottom: 1px solid #E3E8EF"><span>ITEM NAME</span><span style="text-align: center">QTY</span><span style="text-align: right">PRICE</span><span style="text-align: right">AMOUNT</span></div>
<sc-for list="{{items}}" as="i" hint-placeholder-count="2"><div style="display: grid; grid-template-columns: 1fr 40px 80px 90px; gap: 8px; font-size: 14px; padding: 6px 0; font-variant-numeric: tabular-nums"><span style="font-weight: 700">{{i.name}}</span><span style="text-align: center">{{i.qty}}</span><span style="text-align: right">{{i.price}}</span><span style="text-align: right; font-weight: 800">{{i.amount}}</span></div></sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { type: 0, sel: 0 }; }
renderVals() {
const s = this.state;
const f = (v) => 'Rs ' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const names = ['Void Line', 'Void Sale', 'No Sale', 'Refund', 'Age Refusal'];
const types = names.map((name, i) => ({
name, pick: () => this.setState({ type: i, sel: 0 }),
style: 'height: 38px; padding: 0 12px; border-radius: 9px; border: 0; font-size: 13px; font-weight: 800; ' + (i === s.type ? 'background: #FFFFFF; color: #A12A21; box-shadow: 0 1px 3px rgba(16,24,40,0.15)' : 'background: transparent; color: #475467')
}));
const data = [
['#000124', '[11 Oct · 10:44]', '[Staff 1]', '[Scanned in error]', [['Ambul Bananas 1kg', 1, 320]]],
['#000119', '[11 Oct · 09:46]', '[Staff 1]', '[Wrong price]', [['Biscuits', 1, 220]]],
['#000107', '[10 Oct · 17:12]', '[Staff 2]', '[Customer changed mind]', [['Coffee', 2, 250]]],
['#000098', '[10 Oct · 12:03]', '[Staff 3]', '[Damaged item]', [['Eggs x10', 1, 550]]]
];
const rows = data.map(([no, date, user, reason, its], i) => ({
no, date, user, reason, amount: f(its.reduce((a, x) => a + x[1] * x[2], 0)),
pick: () => this.setState({ sel: i }),
style: 'display: grid; grid-template-columns: 110px 150px 1fr 1fr 130px; gap: 12px; align-items: center; min-height: 54px; padding: 0 20px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sel ? '#FDECEA; box-shadow: inset 4px 0 0 #C0362C' : '#FFFFFF')
}));
const items = data[s.sel][4].map(([name, qty, price]) => ({ name, qty: String(qty), price: f(price), amount: f(qty * price) }));
return { types, rows, items };
}
}
</script>
</body>
</html>
