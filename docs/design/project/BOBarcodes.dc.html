<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage barcode products</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 14px">
<a href="BackOffice.dc.html" aria-label="Back to Back Office" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">PRODUCT MANAGEMENT</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">{{title}}</h1></div>
</div>
<div role="tablist" aria-label="Product manager" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.08)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{t.aria}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button></sc-for>
</div>
</header>

<sc-if value="{{isManage}}" hint-placeholder-val="{{ true }}">
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 10px">
<input type="search" aria-label="Barcode / Description" placeholder="Barcode / Description" style="flex-grow: 1; height: 50px; box-sizing: border-box; border-radius: 13px; border: 1px solid #DCE2EA; background: #FFFFFF; padding: 0 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D">
<button type="button" style="height: 50px; padding: 0 22px; border-radius: 13px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Search</button>
<a href="BOAddBarcode.dc.html" style="height: 50px; padding: 0 20px; border-radius: 13px; background: #0B8A5F; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center">Add New</a>
<a href="BOAddBarcode.dc.html" style="height: 50px; padding: 0 18px; border-radius: 13px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800; display: flex; align-items: center">Edit</a>
<button type="button" onClick="{{askDelete}}" style="height: 50px; padding: 0 18px; border-radius: 13px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 15px; font-weight: 800">Delete</button>
</div>
<sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 14px; background: #FDECEA; border: 1px solid #F5C9C4; padding: 12px 16px">
<span style="font-size: 14px; font-weight: 700; color: #A12A21">{{confirmText}}</span>
<span style="display: flex; gap: 8px"><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 13px; font-weight: 800">No</button><sc-if value="{{canDelete}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #C0362C; color: #FFFFFF; font-size: 13px; font-weight: 800">Delete</button></sc-if></span>
</div>
</sc-if>
<div style="flex-grow: 1; min-height: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 170px 1fr 130px 120px 100px 120px; gap: 12px; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>BARCODE</span><span>DESCRIPTION</span><span>DEPARTMENT</span><span style="text-align: right">PRICE</span><span style="text-align: right">STOCK</span><span>VAT</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475467; text-align: left">{{r.code}}</span><span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; text-align: left">{{r.name}}<sc-if value="{{r.promo}}" hint-placeholder-val="{{ false }}"><span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #FFF4DE; color: #8A5300; font-size: 11px; font-weight: 800; display: flex; align-items: center">IN PROMO</span></sc-if></span><span style="font-size: 14px; color: #475467; text-align: left">{{r.dept}}</span><span style="font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{r.price}}</span><span style="font-size: 15px; text-align: right">{{r.stock}}</span><span style="font-size: 14px; color: #475467; text-align: left">{{r.vat}}</span></button>
</sc-for>
</div>
</main>
</sc-if>

<sc-if value="{{isStockIn}}" hint-placeholder-val="{{ false }}">
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; gap: 20px">
<div style="flex-grow: 1; min-width: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 70px 170px 1fr 110px; gap: 12px; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>ID</span><span>BARCODE</span><span>DESCRIPTION</span><span style="text-align: right">STOCK</span></div>
<sc-for list="{{stockRows}}" as="r" hint-placeholder-count="5">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}"><span style="font-size: 14px; color: #475467; text-align: left">{{r.id}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475467; text-align: left">{{r.code}}</span><span style="font-size: 15px; font-weight: 700; text-align: left">{{r.name}}</span><span style="font-size: 15px; font-weight: 800; text-align: right; color: #0B6B4A">+{{r.qty}}</span></button>
</sc-for>
</div>
<aside style="width: 380px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 20px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Edit Stock</h2>
<span style="font-size: 14px; color: #475467">{{selName}}</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Stock Count<input type="text" value="{{selQty}}" placeholder="Enter Stock Count" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 2px solid #163A6B; background: #FFFFFF; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; color: #0F1B2D"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 14px; font-weight: 800">Cancel</button><button type="button" style="height: 48px; border-radius: 12px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 14px; font-weight: 800">Update</button></div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #EEF1F5; padding-top: 14px">
<button type="button" style="height: 54px; border-radius: 14px; border: 0; background: #0B8A5F; color: #FFFFFF; font-size: 15px; font-weight: 800">Stock in</button>
<button type="button" style="height: 50px; border-radius: 14px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 15px; font-weight: 800">Reject</button>
</div>
</aside>
</main>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 0, sel: 1, confirm: false, sSel: 0 }; }
renderVals() {
const s = this.state;
const f = (v) => 'Rs ' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const names = ['Manage Barcode Products', 'Stock in'];
const tabs = names.map((name, i) => ({
name, aria: i === s.tab ? 'true' : 'false', pick: () => this.setState({ tab: i }),
style: 'height: 42px; padding: 0 16px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 800; ' + (i === s.tab ? 'background: #FFFFFF; color: #0D2547' : 'background: transparent; color: #C7D4E6')
}));
const data = [
['4791111000017', 'Fresh Milk 1L', 'Dairy', 480, 42, 'VAT 18%', false], ['4791111000048', 'Water 500ml', 'Drinks', 100, 96, 'VAT 18%', true],
['4791111000024', 'Sliced Bread 450g', 'Bakery', 180, 18, 'VAT exempt', false], ['4791111000031', 'Eggs x10', 'Dairy', 550, 6, 'VAT exempt', false],
['4791111000055', 'Fish Bun', 'Bakery', 80, 3, 'VAT exempt', false], ['4791111000079', 'Samba Rice 5kg', 'Grocery', 1450, 12, 'VAT exempt', false],
['4791111000101', 'Chocolate Biscuits', 'Grocery', 220, 30, 'VAT 18%', true]
];
const rows = data.map((d, i) => ({
code: d[0], name: d[1], dept: d[2], price: f(d[3]), stock: String(d[4]), vat: d[5], promo: d[6],
pick: () => this.setState({ sel: i, confirm: false }),
style: 'display: grid; grid-template-columns: 170px 1fr 130px 120px 100px 120px; gap: 12px; align-items: center; min-height: 54px; padding: 0 20px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sel ? '#EDF3FC; box-shadow: inset 4px 0 0 #F5A524' : '#FFFFFF')
}));
const stock = [['31', '4791111000017', 'Fresh Milk 1L', 24], ['32', '4791111000031', 'Eggs x10', 30], ['33', '4791111000048', 'Water 500ml', 48], ['34', '4791111000086', 'Dhal 1kg', 20]];
const stockRows = stock.map((d, i) => ({
id: d[0], code: d[1], name: d[2], qty: String(d[3]), pick: () => this.setState({ sSel: i }),
style: 'display: grid; grid-template-columns: 70px 170px 1fr 110px; gap: 12px; align-items: center; min-height: 54px; padding: 0 20px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sSel ? '#EDF3FC; box-shadow: inset 4px 0 0 #F5A524' : '#FFFFFF')
}));
const d = data[s.sel];
return {
tabs, rows, stockRows, title: names[s.tab], isManage: s.tab === 0, isStockIn: s.tab === 1,
confirm: s.confirm, canDelete: !d[6],
confirmText: d[6] ? 'Product is used in Promotion. Please remove it first.' : 'Are you sure you want to delete ' + d[1] + '?',
askDelete: () => this.setState({ confirm: true }), cancelDelete: () => this.setState({ confirm: false }),
selName: stock[s.sSel][2], selQty: String(stock[s.sSel][3])
};
}
}
</script>
</body>
</html>
