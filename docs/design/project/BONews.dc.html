<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>News paper and magazine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="BackOffice.dc.html" aria-label="Back to Back Office" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">BACK OFFICE · INVENTORY CONTROL</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">Manage News Paper and Magazine</h1></div>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; gap: 20px">
<section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 10px">
<input type="search" aria-label="Description / Barcode" placeholder="Description / Barcode" style="flex-grow: 1; height: 48px; box-sizing: border-box; border-radius: 13px; border: 1px solid #DCE2EA; background: #FFFFFF; padding: 0 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D">
<button type="button" style="height: 48px; padding: 0 20px; border-radius: 13px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Find</button>
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: #E3E8EF"><sc-for list="{{cats}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button></sc-for></div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; font-size: 14px; font-weight: 600; color: #667085">{{hint}}</span>
<button type="button" onClick="{{addNew}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #0B8A5F; color: #FFFFFF; font-size: 14px; font-weight: 800">Add New</button>
<button type="button" onClick="{{edit}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 14px; font-weight: 800">Edit</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 14px; font-weight: 800">Delete</button>
</div>
<div style="flex-grow: 1; min-height: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 170px 1fr 110px 110px 110px; gap: 12px; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>BARCODE</span><span>DESCRIPTION</span><span>CATEGORY</span><span>TYPE</span><span style="text-align: right">PRICE</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475467; text-align: left">{{r.code}}</span><span style="font-size: 15px; font-weight: 700; text-align: left">{{r.name}}</span><span style="font-size: 14px; color: #475467; text-align: left">{{r.cat}}</span><span style="font-size: 14px; color: #475467; text-align: left">{{r.type}}</span><span style="font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{r.price}}</span></button>
</sc-for>
</div>
</section>
<aside style="width: 400px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 20px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 19px; font-weight: 800">{{formTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6"><label style="{{f.wrap}}">{{f.label}}<input type="text" value="{{f.value}}" placeholder="{{f.hint}}" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700; color: #344054">Type</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><sc-for list="{{types}}" as="t" hint-placeholder-count="4"><button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button></sc-for></div></div>
<span style="font-size: 12px; color: #667085; line-height: 1.5">Barcode: ISSN must be exactly 10 digits (newspaper) or 11 digits (magazine). Issue number must be a single digit (1–9).</span>
<button type="button" style="margin-top: auto; height: 54px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Save</button>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { cat: 0, sel: 0, mode: 'edit', type: 0 }; }
renderVals() {
const s = this.state;
const f = (v) => 'Rs ' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const catNames = ['All', 'News Paper', 'Magazine'];
const cats = catNames.map((name, i) => ({ name, pick: () => this.setState({ cat: i, sel: 0 }), style: 'height: 40px; padding: 0 14px; border-radius: 10px; border: 0; font-size: 13px; font-weight: 800; ' + (i === s.cat ? 'background: #FFFFFF; color: #163A6B' : 'background: transparent; color: #475467') }));
const data = [
['9771234567003', '[Daily newspaper (English)]', 'News Paper', 'Daily', 120], ['9771234568109', '[Daily newspaper (Sinhala)]', 'News Paper', 'Daily', 100],
['9771234569205', '[Sunday edition]', 'News Paper', 'Sunday', 180], ['9771234570306', '[Weekly news magazine]', 'Magazine', 'Weekly', 350],
['9771234571402', '[Monthly lifestyle magazine]', 'Magazine', 'Monthly', 650], ['9771234572508', '[Children’s monthly]', 'Magazine', 'Monthly', 300]
];
const shown = data.map((d, i) => ({ d, i })).filter(({ d }) => s.cat === 0 || d[2] === catNames[s.cat]);
const editing = s.mode === 'edit';
const rows = shown.map(({ d, i }) => ({
code: d[0], name: d[1], cat: d[2], type: d[3], price: f(d[4]),
pick: () => this.setState({ sel: i, mode: 'edit', type: ['Daily', 'Weekly', 'Monthly', 'Sunday'].indexOf(d[3]) }),
style: 'display: grid; grid-template-columns: 170px 1fr 110px 110px 110px; gap: 12px; align-items: center; min-height: 54px; padding: 0 20px; border: 0; border-bottom: 1px solid #EEF1F5; color: #0F1B2D; background: ' + (i === s.sel && editing ? '#EDF3FC; box-shadow: inset 4px 0 0 #F5A524' : '#FFFFFF')
}));
const d = data[s.sel];
const F = (label, hint, v, span) => ({ label, hint, value: editing ? v : '', wrap: 'display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054; grid-column: span ' + span });
const fields = [F('Category', 'Select Category', d[2], 1), F('Price', 'Rs 0.00', f(d[4]), 1), F('Description', 'Description', d[1], 2), F('Department', 'Select Department', 'News and Magazines', 1), F('Sub Department', 'Select Sub Department', d[2], 1), F('Barcode', 'ISSN barcode', d[0], 2)];
const types = ['Daily', 'Weekly', 'Monthly', 'Sunday'].map((name, i) => ({ name, pick: () => this.setState({ type: i }), style: 'height: 40px; border-radius: 10px; font-size: 13px; font-weight: 800; ' + (i === s.type ? 'border: 2px solid #163A6B; background: #EDF3FC; color: #163A6B' : 'border: 1px solid #E3E8EF; background: #F7F9FB; color: #344054') }));
return {
cats, rows, fields, types,
hint: editing ? 'Selected: ' + d[1] : 'Please select an item to edit or delete',
formTitle: editing ? 'Edit News Paper and Magazine' : 'Add New News Paper and Magazine',
addNew: () => this.setState({ mode: 'add' }), edit: () => this.setState({ mode: 'edit' })
};
}
}
</script>
</body>
</html>
