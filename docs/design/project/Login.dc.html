<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex">

<section style="width: 560px; flex-shrink: 0; box-sizing: border-box; padding: 56px; background: #0D2547; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
<svg aria-hidden="true" width="520" height="520" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.8" style="position: absolute; right: -180px; top: 180px"><circle cx="12" cy="12" r="11"></circle><circle cx="12" cy="12" r="7.5"></circle><circle cx="12" cy="12" r="4"></circle></svg>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; position: relative; color: #FFFFFF">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #F5A524; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D2547" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 9h-13z"></path><path d="M8 7V5a4 4 0 0 1 8 0v2"></path></svg></span>
<span style="font-size: 24px; font-weight: 800">Tillora</span></a>
<div style="display: flex; flex-direction: column; gap: 18px; position: relative">
<span style="width: fit-content; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(245,165,36,0.16); color: #F8C46A; font-size: 13px; font-weight: 700; display: flex; align-items: center; letter-spacing: 0.04em">{{badge}}</span>
<h1 style="margin: 0; font-size: 52px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em">[Company name]</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #C7D4E6; max-width: 400px">{{note}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative">
<div style="border-radius: 14px; background: rgba(255,255,255,0.06); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: #AFC0D8">Terminal</span><span style="font-size: 16px; font-weight: 700">[POS-01]</span></div>
<div style="border-radius: 14px; background: rgba(255,255,255,0.06); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: #AFC0D8">Database</span><span style="font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #34C38F"></span>Local · Ready</span></div>
</div>
</section>

<section style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 460px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E3E8EF; box-shadow: 0 16px 40px -20px rgba(16,24,40,0.25); padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">{{title}}</h2>
<span style="font-size: 15px; color: #667085">Please fill the form for get started</span>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700; color: #344054">User Name
<span style="position: relative; display: flex; align-items: center">
<span style="position: absolute; left: 16px; display: flex"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
<input type="text" placeholder="User Name" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 14px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 16px 0 46px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; color: #0F1B2D"></span></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700; color: #344054">Password
<span style="position: relative; display: flex; align-items: center">
<span style="position: absolute; left: 16px; display: flex"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
<input type="{{pwType}}" placeholder="Password" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 14px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 56px 0 46px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; color: #0F1B2D">
<button type="button" aria-label="{{eyeLabel}}" onClick="{{toggle}}" style="position: absolute; right: 6px; width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</span></label>
<a href="{{next}}" style="height: 60px; border-radius: 16px; background: #163A6B; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 12px 24px -12px rgba(22,58,107,0.8)">Login<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
<a href="Main.dc.html" style="text-align: center; font-size: 14px; font-weight: 700; color: #475467">Cancel</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"module":{"editor":"enum","options":["Sales","Back Office Panel","Product Management","Report","Settings"],"default":"Sales"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { show: false }; }
renderVals() {
const m = this.props.module ?? 'Sales';
const map = {
'Sales': ['Sales.dc.html', 'SALES', 'Staff need sales access to open the till.'],
'Back Office Panel': ['BackOffice.dc.html', 'BACK OFFICE', 'Back office access is set in Role Access Control.'],
'Product Management': ['ProductMgt.dc.html', 'PRODUCT MANAGEMENT', 'Manage non-barcode, weight and payout products.'],
'Report': ['QuickReport.dc.html', 'QUICK REPORT', 'Report login access is set in System Configuration.'],
'Settings': ['Settings.dc.html', 'SETTINGS', 'Only admin can access settings.']
};
const d = map[m] || map.Sales;
return {
title: 'Login to ' + m, next: d[0], badge: d[1], note: d[2],
pwType: this.state.show ? 'text' : 'password', eyeLabel: this.state.show ? 'Hide password' : 'Show password',
toggle: () => this.setState({ show: !this.state.show })
};
}
}
</script>
</body>
</html>
