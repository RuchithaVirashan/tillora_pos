<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Back office</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 14px">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Back Office</h1>
</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: #AFC0D8">
<span>Logged in as [Manager]</span>
<a href="Main.dc.html" style="height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center">Close</a>
</div>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 26px 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 18px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 22px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px"><span style="{{g.bar}}"></span><h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: #475467">{{g.title}}</h2></div>
<div style="{{g.grid}}">
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
<a href="{{i.href}}" style="{{i.card}}"><span style="{{i.chip}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{i.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.icon}}"></path></svg></span><span style="font-size: 15px; font-weight: 800; color: #0F1B2D; line-height: 1.25">{{i.name}}</span></a>
</sc-for>
</div>
</section>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const I = {
dept: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z', user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21a8 8 0 0 1 16 0', card: 'M2 5h20v14H2zM2 10h20',
lock: 'M4 11h16v10H4zM8 11V7a4 4 0 0 1 8 0v4', sales: 'M3 12a9 9 0 1 0 3-6.7M3 4v5h5', box: 'M21 8l-9-5-9 5 9 5zM3 8v8l9 5 9-5V8M12 13v8',
tag: 'M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z', ticket: 'M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z', news: 'M4 4h13v16H6a2 2 0 0 1-2-2zM17 8h3v10a2 2 0 0 1-2 2M8 8h5M8 12h5M8 16h3',
label: 'M3 5h18v14H3zM7 9h10M7 13h6', promo: 'M12 2l2.9 6.9L22 10l-5.5 4.7L18.2 22 12 18.3 5.8 22l1.7-7.3L2 10l7.1-1.1z', restore: 'M12 3v12M7 10l5 5 5-5M5 21h14',
move: 'M4 20V10M10 20V4M16 20v-7M22 20H2', sale: 'M3 3v18h18M7 15l4-4 3 3 5-6', adj: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0'
};
const groups = [
['MANAGEMENT', '#2952A3', '#E8EEFB', [['Department Manager', 'BODepartments.dc.html', 'dept'], ['User Manager', 'BOUsers.dc.html', 'user'], ['Payment Type Manager', 'BOPaymentTypes.dc.html', 'card'], ['Role Access Manager', 'BORoleAccess.dc.html', 'lock']], 4],
['INVENTORY CONTROL', '#0B7A55', '#E3F5EE', [['Sales Manager', 'BOSalesManager.dc.html', 'sales'], ['Stock Manager', 'BOStock.dc.html', 'box'], ['Product Manager', 'BOBarcodes.dc.html', 'tag'], ['Lottery', 'BOLottery.dc.html', 'ticket'], ['News Paper and Magazine', 'BONews.dc.html', 'news'], ['Label Printer', 'BOLabelPrinter.dc.html', 'label']], 3],
['PROMOTION', '#9A5B00', '#FFF3DC', [['Promotion Manager', 'BOPromotions.dc.html', 'promo'], ['Restore Promotions', 'BOPromotions.dc.html', 'restore']], 2],
['REPORT', '#5B3FB0', '#EFEAFB', [['Stock Movement', 'BOReports.dc.html', 'move'], ['Sale', 'BOReports.dc.html', 'sale'], ['Stock Adjustment', 'BOReports.dc.html', 'adj']], 3]
].map(([title, ink, bg, items, cols]) => ({
title,
bar: 'width: 6px; height: 18px; border-radius: 3px; background: ' + ink,
grid: 'flex-grow: 1; display: grid; grid-template-columns: repeat(' + cols + ', minmax(0, 1fr)); gap: 12px',
items: items.map(([name, href, icon]) => ({
name, href, ink, icon: I[icon],
chip: 'width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: ' + bg,
card: 'border-radius: 16px; border: 1px solid #E3E8EF; background: #F9FAFC; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 110px'
}))
}));
return { groups };
}
}
</script>
</body>
</html>
