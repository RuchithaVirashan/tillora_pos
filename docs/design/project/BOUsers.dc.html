<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="BackOffice.dc.html" aria-label="Back to Back Office" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">BACK OFFICE · MANAGEMENT</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">Manage Users</h1></div>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px 28px; display: flex; gap: 20px">
<section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; font-size: 14px; font-weight: 600; color: #667085">{{hint}}</span>
<button type="button" onClick="{{addNew}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 14px; font-weight: 800">Add New</button>
<button type="button" onClick="{{edit}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 14px; font-weight: 800">Edit</button>
<button type="button" onClick="{{askDelete}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #F5C9C4; background: #FDECEA; color: #A12A21; font-size: 14px; font-weight: 800">Delete</button>
</div>
<sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 14px; background: #FDECEA; border: 1px solid #F5C9C4; padding: 12px 16px">
<span style="font-size: 14px; font-weight: 700; color: #A12A21">{{confirmText}}</span>
<span style="display: flex; gap: 8px"><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 13px; font-weight: 800">No</button><sc-if value="{{canDelete}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{cancelDelete}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #C0362C; color: #FFFFFF; font-size: 13px; font-weight: 800">Delete</button></sc-if></span>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<button type="button" onClick="{{r.pick}}" style="{{r.card}}">
<span style="{{r.avatar}}">{{r.ini}}</span>
<span style="display: flex; flex-direction: column; gap: 3px; text-align: left; flex-grow: 1"><span style="font-size: 16px; font-weight: 800; color: #0F1B2D">{{r.name}}</span><span style="font-size: 13px; color: #667085">{{r.role}}</span></span>
<sc-if value="{{r.live}}" hint-placeholder-val="{{ false }}"><span style="height: 24px; padding: 0 9px; border-radius: 999px; background: #E3F5EE; color: #0B6B4A; font-size: 11px; font-weight: 800; display: flex; align-items: center">ON SHIFT</span></sc-if>
</button>
</sc-for>
</div>
</section>
<aside style="width: 400px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 20px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">{{formTitle}}</h2>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">User Name<input type="text" value="{{fName}}" placeholder="User Name" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Password<input type="password" value="{{fPass}}" placeholder="Password" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">Select Role<select style="height: 48px; border-radius: 12px; border: 1px solid #DCE2EA; padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D; background: #F7F9FB"><option>{{fRole}}</option><option>Cashier</option><option>Supervisor</option><option>Manager</option><option>Admin</option></select></label>
<span style="font-size: 13px; color: #667085">Roles and their access are set in Role Access Manager.</span>
<a href="BORoleAccess.dc.html" style="font-size: 14px; font-weight: 800; color: #163A6B">Open Role Access Control</a>
<button type="button" style="margin-top: auto; height: 54px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Save</button>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0, mode: 'edit', confirm: false }; }
renderVals() {
const s = this.state;
const tints = [['#E8EEFB', '#2952A3'], ['#E3F5EE', '#0B7A55'], ['#FFF3DC', '#9A5B00'], ['#EFEAFB', '#5B3FB0'], ['#EEF1F5', '#3B4A60'], ['#DFF3F3', '#0B6E6E']];
const data = [['[admin]', 'AD', 'Admin', false], ['[manager]', 'MG', 'Manager', false], ['[staff1]', 'S1', 'Cashier', true], ['[staff2]', 'S2', 'Cashier', true], ['[staff3]', 'S3', 'Supervisor', false], ['[staff4]', 'S4', 'Cashier', false]];
const editing = s.mode === 'edit';
const rows = data.map(([name, ini, role, live], i) => ({
name, role, live, ini: '[' + ini + ']', pick: () => this.setState({ sel: i, mode: 'edit', confirm: false }),
avatar: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: ' + tints[i][0] + '; color: ' + tints[i][1],
card: 'border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; ' + (i === s.sel && editing ? 'border: 2px solid #163A6B' : 'border: 1px solid #E3E8EF')
}));
const d = data[s.sel];
return {
rows, confirm: s.confirm, canDelete: !d[3],
hint: editing ? 'Selected: ' + d[0] : 'Please select an item to edit or delete',
formTitle: editing ? 'Edit User' : 'Add New User',
fName: editing ? d[0] : '', fPass: editing ? '********' : '', fRole: editing ? d[2] : 'Select Role',
confirmText: d[3] ? 'Cannot delete this user. User is on live shift.' : 'Are you sure you want to delete ' + d[0] + '?',
addNew: () => this.setState({ mode: 'add', confirm: false }), edit: () => this.setState({ mode: 'edit' }),
askDelete: () => this.setState({ confirm: true }), cancelDelete: () => this.setState({ confirm: false })
};
}
}
</script>
</body>
</html>
