<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expired items report</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="QuickReport.dc.html" aria-label="Back to Quick Report" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Expired Items Report</h1>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 12px; align-items: flex-end; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; padding: 16px 18px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #667085">Expired Before (Optional)<input type="text" value="{{dateText}}" readonly style="height: 46px; width: 220px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label>
<button type="button" onClick="{{all}}" style="{{allStyle}}">All</button>
<button type="button" style="margin-left: auto; height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Print Report</button>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 18px; overflow: hidden">
<div style="display: grid; grid-template-columns: 170px 1fr 160px 120px 120px; gap: 12px; padding: 12px 20px; background: #F7F9FB; border-bottom: 1px solid #E3E8EF; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #667085"><span>BARCODE</span><span>DESCRIPTION</span><span>DEPARTMENT</span><span>EXPIRY</span><span style="text-align: right">STOCK</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 170px 1fr 160px 120px 120px; gap: 12px; align-items: center; min-height: 54px; padding: 0 20px; border-bottom: 1px solid #EEF1F5">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475467">{{r.code}}</span><span style="font-size: 15px; font-weight: 700">{{r.name}}</span><span style="font-size: 14px; color: #475467">{{r.dept}}</span><span style="width: fit-content; height: 26px; padding: 0 10px; border-radius: 999px; background: #FDECEA; color: #A12A21; font-size: 12px; font-weight: 800; display: flex; align-items: center">{{r.exp}}</span><span style="text-align: right; font-size: 15px; font-weight: 800">{{r.stock}}</span>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { all: false }; }
renderVals() {
const s = this.state;
const rows = [['4791111000055', 'Fish Bun', 'Bakery', '[10 Oct]', '3'], ['4791111000024', 'Sliced Bread 450g', 'Bakery', '[09 Oct]', '2'], ['4791111000093', 'Curd 1L', 'Dairy', '[08 Oct]', '4'], ['4791111000017', 'Fresh Milk 1L', 'Dairy', '[07 Oct]', '1']]
.map(([code, name, dept, exp, stock]) => ({ code, name, dept, exp, stock }));
return {
rows, dateText: s.all ? 'All' : '[11/10/2026]', all: () => this.setState({ all: !s.all }),
allStyle: 'height: 46px; padding: 0 18px; border-radius: 12px; font-size: 15px; font-weight: 800; ' + (s.all ? 'border: 2px solid #163A6B; background: #EDF3FC; color: #163A6B' : 'border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054')
};
}
}
</script>
</body>
</html>
