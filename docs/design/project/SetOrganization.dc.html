<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup organization</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="Settings.dc.html" aria-label="Back to Settings" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #AFC0D8; letter-spacing: 0.08em">SETTINGS</span><h1 style="margin: 0; font-size: 22px; font-weight: 800">Setup Organization</h1></div>
</header>
<main style="flex-grow: 1; display: flex; justify-content: center; padding: 32px">
<div style="width: 880px; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 22px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; align-self: flex-start">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 20px; font-weight: 800">Company details</h2><span style="font-size: 14px; color: #667085">Printed on receipts and reports</span></div>
<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{unlock}}" style="height: 46px; padding: 0 20px; border-radius: 12px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Edit</button></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
<label style="{{f.wrap}}">{{f.label}}<input type="text" value="{{f.value}}" placeholder="{{f.hint}}" readonly="{{f.ro}}" style="{{f.input}}"></label>
</sc-for>
</div>
<sc-if value="{{saved}}" hint-placeholder-val="{{ false }}"><div style="border-radius: 14px; background: #E3F5EE; color: #0B6B4A; padding: 12px 16px; font-size: 14px; font-weight: 800">Company Details Updated Successfully</div></sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}"><div style="display: flex; justify-content: flex-end; gap: 10px"><button type="button" onClick="{{lock}}" style="height: 52px; padding: 0 22px; border-radius: 14px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Cancel</button><button type="button" onClick="{{save}}" style="height: 52px; padding: 0 28px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">Save</button></div></sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { edit: false, saved: false }; }
renderVals() {
const s = this.state;
const list = [['Company Name', '[Company name]', 'Company Name', 2], ['Address Line 1', '[No. 00, Main Street]', 'Address Line 1', 2], ['Address Line 2', '[City]', 'Address Line 2', 2], ['Primary Phone', '[+94 11 000 0000]', 'Phone Number 1', 1], ['Secondary Phone', '[+94 77 000 0000]', 'Phone Number 2', 1], ['Vat Number', '[VAT registration number]', 'Vat Number', 2]];
const fields = list.map(([label, value, hint, span]) => ({
label, value, hint, ro: !s.edit,
wrap: 'display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054; grid-column: span ' + span,
input: 'height: 50px; box-sizing: border-box; border-radius: 12px; padding: 0 14px; font-family: \'Plus Jakarta Sans\', sans-serif; font-size: 15px; color: #0F1B2D; ' + (s.edit ? 'border: 2px solid #163A6B; background: #FFFFFF' : 'border: 1px solid #E3E8EF; background: #F7F9FB')
}));
return {
fields, locked: !s.edit, editing: s.edit, saved: s.saved,
unlock: () => this.setState({ edit: true, saved: false }), lock: () => this.setState({ edit: false }), save: () => this.setState({ edit: false, saved: true })
};
}
}
</script>
</body>
</html>
