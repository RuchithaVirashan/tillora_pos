<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product management</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#163A6B;text-decoration:none}a:hover{color:#0D2547}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F1F4F8; font-family: 'Plus Jakarta Sans', sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; background: #0D2547; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Product Management</h1>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 26px 28px; display: flex; gap: 20px">
<div style="width: 520px; flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<sc-if value="{{t.isLink}}" hint-placeholder-val="{{ false }}"><a href="{{t.href}}" style="{{t.card}}"><span style="{{t.chip}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span><span style="font-size: 16px; font-weight: 800; color: #0F1B2D; text-align: left">{{t.name}}</span></a></sc-if>
<sc-if value="{{t.isBtn}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{t.pick}}" style="{{t.card}}"><span style="{{t.chip}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span><span style="font-size: 16px; font-weight: 800; color: #0F1B2D; text-align: left">{{t.name}}</span></button></sc-if>
</sc-for>
</div>
<section style="flex-grow: 1; min-width: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 20px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">{{panelTitle}}</h2>
<span style="font-size: 13px; color: #667085">{{panelNote}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
<sc-if value="{{f.isCheck}}" hint-placeholder-val="{{ false }}"><label style="display: flex; align-items: center; gap: 10px; height: 46px; font-size: 15px; font-weight: 700; color: #344054"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #163A6B">{{f.label}}</label></sc-if>
<sc-if value="{{f.isText}}" hint-placeholder-val="{{ true }}"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #344054">{{f.label}}<input type="text" placeholder="{{f.hint}}" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EA; background: #F7F9FB; padding: 0 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0F1B2D"></label></sc-if>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 10px">
<button type="button" style="height: 52px; padding: 0 22px; border-radius: 14px; border: 1px solid #DCE2EA; background: #FFFFFF; color: #344054; font-size: 15px; font-weight: 800">Cancel</button>
<button type="button" style="height: 52px; padding: 0 28px; border-radius: 14px; border: 0; background: #163A6B; color: #FFFFFF; font-size: 15px; font-weight: 800">{{action}}</button>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0 }; }
renderVals() {
const s = this.state;
const T = (label, hint) => ({ label, hint: hint || label, isText: true, isCheck: false });
const C = (label) => ({ label, hint: '', isText: false, isCheck: true });
const list = [
['Manage Non-Barcode Products', '#2952A3', '#E8EEFB', 'M4 6h16M4 12h16M4 18h10', null, 'Add New Non Barcode Item', 'Shown as quick items on the sales screen', [T('ID'), T('Description'), T('Price', 'Rs 0.00'), T('Department', 'Select Department'), T('VAT', 'VAT 18%'), T('Parent Key', 'Select Parent Key'), C('Age Refusal'), C('Enable Sub Key')], 'Add'],
['Add Weight Products', '#0B7A55', '#E3F5EE', 'M12 3v3M5 9h14l-2 11H7zM9 13h6', null, 'Add New Weight Item', 'Price per kg, read from scale barcodes', [T('Code', 'Item Code'), T('Description', 'Item Description'), T('Price', 'Item Price'), T('Department', 'Select Department'), T('VAT', 'VAT 18%'), C('Age Refusal')], 'Save'],
['Manage Payout Products', '#9A5B00', '#FFF3DC', 'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6', null, 'Add New Payout', 'Reasons shown on the Payout screen', [T('ID', 'Payout ID'), T('Name', 'Payout Name')], 'Save'],
['Adjust Stock', '#5B3FB0', '#EFEAFB', 'M21 8l-9-5-9 5 9 5zM3 8v8l9 5 9-5V8', null, 'Stock Adjustment', 'Please scan barcode and tap Find to load data', [T('Barcode', 'Search Barcode'), T('Description', 'Item Description'), T('Reason', 'Select Reason'), T('Current Stock', '0'), T('New Qty', '0'), T('New Stock', '0')], 'Adjust Stock'],
['Price Change', '#B4233C', '#FDECEE', 'M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z', null, 'Price Change', 'After updating you can print a QL or receipt label', [T('Barcode', 'Search Barcode'), T('Description', 'Item Description'), T('Current Price', 'Rs 0.00'), T('New Price', 'Rs 0.00'), C('Confirm Expiration'), C('Mark as Expired')], 'Update'],
['Quick Label', '#0B6E6E', '#DFF3F3', 'M3 5h18v14H3zM7 9h10M7 13h6', null, 'Quick Label', 'Print a shelf label for one product', [T('Barcode', 'Search Barcode'), T('Description', 'Item Description'), T('Label Type', 'QL or Receipt')], 'Print Label']
];
const tiles = list.map(([name, ink, bg, icon, href], i) => ({
name, ink, icon, href: href || '#', isLink: !!href, isBtn: !href, pick: () => this.setState({ sel: i }),
chip: 'width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: ' + bg,
card: 'border-radius: 18px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-decoration: none; background: #FFFFFF; ' + (i === s.sel ? 'border: 2px solid #163A6B; box-shadow: 0 10px 24px -14px rgba(22,58,107,0.6)' : 'border: 1px solid #E3E8EF')
}));
const d = list[s.sel];
return { tiles, panelTitle: d[5], panelNote: d[6], fields: d[7], action: d[8] };
}
}
</script>
</body>
</html>
