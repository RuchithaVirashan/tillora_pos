name: tillora_pos
description: "Tillora POS - local-first point of sale for desktop and mobile"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, navigation, dependency injection
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  go_router: ^18.0.2
  get_it: ^9.3.0

  # Local database (sqflite on Android/iOS, sqflite_common_ffi on Windows)
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^3.7.0
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # UI (material_ui replaces flutter/material; google_fonts 9 requires it)
  material_ui: ^1.6.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  easy_localization: ^3.0.7
  barcode_widget: ^2.0.4

  # Files, reports, export
  pdf: ^3.10.8
  printing: ^5.12.0
  csv: ^8.0.0
  excel: ^4.0.6
  file_picker: ^13.1.0
  archive: ^3.6.1

  # Hardware (desktop drivers live behind infrastructure/hardware interfaces)
  esc_pos_utils_plus: ^2.0.3
  ffi: ^2.2.0
  window_manager: ^0.5.2
  desktop_multi_window: ^0.3.0
  audioplayers: ^6.4.0

  # Security, device
  crypto: ^3.0.3
  encrypt: ^5.0.3
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    - assets/sounds/
    - assets/labels/
